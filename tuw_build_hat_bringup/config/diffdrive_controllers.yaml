# instructions for bridge-plugin between gazebo and ros2_control
gz_ros_control:
  ros__parameters:
    hold_joints: true
    position_proportional_gain: 0.1

# from now on: everything relevant for real and simulated robot
controller_manager:
  ros__parameters:
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    update_rate: 10

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_motor_wheel_joint"]
    right_wheel_names: ["right_motor_wheel_joint"]

    wheel_separation: 0.112
    wheel_radius: 0.028

    odom_frame_id: "odom"
    base_frame_id: "base_link"

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: true

    linear.x.max_velocity:  1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: .NAN
    linear.x.max_deceleration: .NAN
    linear.x.max_acceleration_reverse: .NAN
    linear.x.max_deceleration_reverse: .NAN
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN


    angular.z.max_velocity:  6.28
    angular.z.min_velocity: -6.28
    angular.z.max_acceleration: .NAN
    angular.z.max_deceleration: .NAN
    angular.z.max_acceleration_reverse: .NAN
    angular.z.max_deceleration_reverse: .NAN
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN