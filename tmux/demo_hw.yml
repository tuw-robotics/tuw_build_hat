##enable named panes in tmux.conf with:
#set -g pane-border-format "#{pane_index} #{pane_title}"
#set -g pane-border-status bottom

# windows
name: build_hat

windows:
  - simulation:
      layout: even-vertical
      panes:
        - robot:
          - printf '\033]2;%s\033\\' 'robot'
          - ros2 launch tuw_build_hat_bringup vehicle.launch.py setup:=hw serial_port:=/dev/ttyAMA0 rviz_launch:=false
        - teleop_input:
          - printf '\033]2;%s\033\\' 'teleop_input'
          - # ros2 run tuw_gamepad gamepad_node --ros-args -p use_stamped_velocity:=true -p scale_linear:=0.5 -p scale_angular:=3.14 -p debug:=true
          - ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true